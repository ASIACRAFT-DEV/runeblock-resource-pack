# Box plugins/BetterHud/config.yml (read 2026-11-06) + v0.8.0: runeblock_m1 in default-hud (both HUDs are gated on
# %arcane_packhud%, so each player sees one). BetterHud rewrites this file at load (comments go).
debug: false
auto-save-time: 300
location-provide-time: 1
debug-level: assets
metrics: false
version-check: false
number-format: '#,###.#'
tick-speed: 1
namespace: betterhud
default-font-name: font.ttf
bossbar-line: 1
bossbar-resource-pack-line: 0
merge-boss-bar: true
disable-to-bedrock-player: true
build-folder-location: BetterHud/build
pack-type: zip
enable-protection: false
enable-self-host: false
force-update: false
self-host-ip: '*'
self-host-port: 8163
merge-other-folders: []
loading-head: random
default-hud:
- runeblock_hud
- runeblock_m1
default-popup: []
default-compass: []
load-minecraft-default-textures: false
included-minecraft-list:
- block
- item
resourcepack-obfuscation: false
clear-build-folder: true
use-legacy-format: false
legacy-serializer: ampersand
minecraft-jar-version: bukkit
remove-default-hotbar: false
disable-legacy-offset: true
merge-with-external-resources: true
