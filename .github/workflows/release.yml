# Push a tag like v0.1.0 → zips pack/ into RuneBlock-<tag>.zip and publishes a GitHub release with its SHA-1.
# The server sends players the release URL + SHA-1 after they join (never during login).
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip
        run: |
          cd pack
          # fixed timestamps + sorted entries so the same content always gives the same SHA-1
          find . -exec touch -d '2026-01-01T00:00:00Z' {} +
          find . -type f ! -name '.gitkeep' | sort | zip -X -q "../RuneBlock-${GITHUB_REF_NAME}.zip" -@
          cd ..
          sha1sum "RuneBlock-${GITHUB_REF_NAME}.zip" | tee sha1.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(cut -d' ' -f1 sha1.txt)
          gh release create "$GITHUB_REF_NAME" "RuneBlock-${GITHUB_REF_NAME}.zip" \
            --title "RuneBlock pack $GITHUB_REF_NAME" \
            --notes "SHA-1: \`$SHA\`"$'\n\n'"URL: https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/RuneBlock-${GITHUB_REF_NAME}.zip"
